<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPad check</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--ink:#0B1A2B;--engrave:#7FA9C4;--rubbing:#F0E2C8;--nova:#FFB03A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--ink);color:var(--engrave);
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:17px;line-height:1.8;
  padding:40px 28px;-webkit-text-size-adjust:100%;}
h1{font-family:ui-serif,"New York",Georgia,serif;font-size:34px;font-weight:600;
  color:var(--rubbing);margin-bottom:6px;letter-spacing:-.01em;}
.verdict{font-size:22px;margin:22px 0;padding:18px;border:3px solid var(--nova);color:var(--nova);}
.row{display:flex;justify-content:space-between;gap:16px;
  border-bottom:3px solid rgba(127,169,196,.14);padding:10px 0;}
.row b{font-weight:700;color:var(--rubbing);}
.ok{color:#9ad39a;} .bad{color:var(--nova);}
canvas{display:block;margin-top:20px;border:3px solid rgba(127,169,196,.2);width:100%;height:90px;}
small{display:block;margin-top:22px;opacity:.6;font-size:13px;line-height:1.6;word-break:break-word;}
</style>
</head>
<body>

<h1>Shanghai Roulette</h1>
<div>tablet check</div>

<!-- Static. If JavaScript runs, it is replaced. If it stays as written
     below, this viewer does not execute scripts and the real app cannot
     work here either. -->
<div class="verdict" id="verdict">
  SCRIPTS ARE NOT RUNNING.<br>
  This viewer shows the file but does not run it.
</div>

<div id="rows"></div>
<canvas id="c" width="600" height="180"></canvas>
<small id="ua"></small>

<script>
(function () {
  var rows = document.getElementById("rows");
  function line(name, value, good) {
    var d = document.createElement("div");
    d.className = "row";
    d.innerHTML = "<b>" + name + "</b><span class='" + (good ? "ok" : "bad") + "'>" + value + "</span>";
    rows.appendChild(d);
  }

  var v = document.getElementById("verdict");
  v.style.borderColor = "#9ad39a";
  v.style.color = "#9ad39a";
  v.innerHTML = "SCRIPTS ARE RUNNING.<br>The app will start here.";

  // canvas 2d — the entire map is drawn with it
  var canvasOk = false;
  try {
    var c = document.getElementById("c");
    var g = c.getContext("2d");
    g.fillStyle = "#06111C"; g.fillRect(0, 0, 600, 180);
    g.globalCompositeOperation = "lighter";
    for (var i = 0; i < 60; i++) {
      var x = 20 + i * 9.5, y = 90 + Math.sin(i / 3) * 45;
      var grd = g.createRadialGradient(x, y, 0, x, y, 22);
      grd.addColorStop(0, "rgba(127,169,196,1)");
      grd.addColorStop(1, "rgba(127,169,196,0)");
      g.fillStyle = grd; g.fillRect(x - 22, y - 22, 44, 44);
    }
    canvasOk = g.getImageData(0, 0, 1, 1).data.length === 4;
  } catch (e) { canvasOk = false; }
  line("canvas — the map", canvasOk ? "yes" : "NO", canvasOk);

  // localStorage — every rating is a real trip that cannot be redone
  var lsOk = false, lsNote = "NO";
  try {
    localStorage.setItem("sh.check", "1");
    lsOk = localStorage.getItem("sh.check") === "1";
    localStorage.removeItem("sh.check");
    lsNote = lsOk ? "yes" : "NO";
  } catch (e) { lsNote = "NO — " + e.name; }
  line("ratings are saved", lsNote, lsOk);

  // a rating written last time this file was opened
  var seen = null;
  try { seen = localStorage.getItem("sh.checkPersist"); localStorage.setItem("sh.checkPersist", new Date().toISOString()); } catch (e) {}
  line("survived the last open", seen ? "yes — " + seen.slice(11, 19) : "first open", !!seen);

  var cryptoOk = false;
  try { var a = new Uint32Array(1); crypto.getRandomValues(a); cryptoOk = true; } catch (e) {}
  line("fair random choice", cryptoOk ? "yes" : "NO (fallback in use)", cryptoOk);

  line("screen", window.innerWidth + " × " + window.innerHeight + " @" + (window.devicePixelRatio || 1) + "x", true);
  line("web audio", (window.AudioContext || window.webkitAudioContext) ? "yes" : "NO", !!(window.AudioContext || window.webkitAudioContext));
  line("files (export)", (typeof Blob !== "undefined" && typeof URL !== "undefined" && URL.createObjectURL) ? "yes" : "NO",
       typeof Blob !== "undefined" && !!(URL && URL.createObjectURL));

  // the camera button on the rating screen
  var capOk = "capture" in document.createElement("input");
  line("camera capture", capOk ? "yes" : "NO — the library opens instead", capOk);

  // photographs live in IndexedDB, and a blob has to survive the round trip
  line("photo storage", "checking…", true);
  var photoRow = rows.lastChild;
  function setPhoto(text, good) {
    photoRow.innerHTML = "<b>photo storage</b><span class='" + (good ? "ok" : "bad") + "'>" + text + "</span>";
  }
  try {
    var req = indexedDB.open("sh-check", 1);
    req.onupgradeneeded = function () { req.result.createObjectStore("m", { keyPath: "id" }); };
    req.onerror = function () { setPhoto("NO — " + (req.error && req.error.name), false); };
    req.onsuccess = function () {
      var db = req.result;
      try {
        var tx = db.transaction("m", "readwrite");
        tx.objectStore("m").put({ id: "a", blob: new Blob([new Uint8Array(2048)], { type: "image/jpeg" }) });
        tx.oncomplete = function () {
          var rd = db.transaction("m").objectStore("m").get("a");
          rd.onsuccess = function () {
            var ok = rd.result && rd.result.blob && rd.result.blob.size === 2048;
            setPhoto(ok ? "yes" : "NO — the file came back wrong", !!ok);
            try { indexedDB.deleteDatabase("sh-check"); } catch (e) {}
          };
        };
        tx.onerror = function () { setPhoto("NO — " + (tx.error && tx.error.name), false); };
      } catch (e) { setPhoto("NO — " + e.name, false); }
    };
  } catch (e) { setPhoto("NO — " + e.name, false); }

  // and iOS must be told not to evict them
  if (navigator.storage && navigator.storage.estimate) {
    line("space", "checking…", true);
    var spaceRow = rows.lastChild;
    navigator.storage.estimate().then(function (est) {
      var mb = function (b) { return Math.round((b || 0) / 1048576) + " MB"; };
      spaceRow.innerHTML = "<b>space</b><span class='ok'>" + mb(est.usage) + " used of " + mb(est.quota) + "</span>";
    }).catch(function () { spaceRow.innerHTML = "<b>space</b><span class='bad'>unknown</span>"; });
  } else {
    line("space", "cannot be measured here", false);
  }
  if (navigator.storage && navigator.storage.persisted) {
    line("photos kept safe", "checking…", true);
    var persistRow = rows.lastChild;
    navigator.storage.persisted().then(function (p) {
      persistRow.innerHTML = "<b>photos kept safe</b><span class='" + (p ? "ok" : "bad") + "'>" +
        (p ? "yes — never evicted" : "not yet — the app asks on the first photo") + "</span>";
    }).catch(function () {});
  }

  var t0 = performance.now(), n = 0;
  (function loop() {
    n++;
    if (performance.now() - t0 < 1500) requestAnimationFrame(loop);
    else line("frame rate", Math.round(n / ((performance.now() - t0) / 1000)) + " fps", n / 1.5 > 45);
  })();

  document.getElementById("ua").textContent = navigator.userAgent;
})();
</script>
</body>
</html>
